<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO基本メタタグ -->
    <title>
      僕らのヴィンテージ - ヴィンテージアイテムの交換プラットフォーム
    </title>
    <meta
      name="description"
      content="僕らのヴィンテージは、ヴィンテージアイテムを愛する人々が集まり、お気に入りのアイテムを交換できるプラットフォームです。古着、アクセサリー、雑貨など様々なヴィンテージアイテムを見つけて交換しましょう。"
    />
    <meta
      name="keywords"
      content="ヴィンテージ,古着,交換,トレード,アンティーク,レトロ,ファッション,僕らのヴィンテージ"
    />
    <meta name="author" content="僕らのヴィンテージ運営チーム" />
    <!-- OGP (Open Graph Protocol) -->
    <meta
      property="og:title"
      content="僕らのヴィンテージ - ヴィンテージアイテムの交換プラットフォーム"
    />
    <meta
      property="og:description"
      content="ヴィンテージアイテムを愛する人々が集まり、お気に入りのアイテムを交換できるプラットフォーム"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bokurano-vintage.com/" />
    <meta
      property="og:image"
      content="https://bokurano-vintage.com/og-image.jpg"
    />
    <meta property="og:site_name" content="僕らのヴィンテージ" />
    <meta property="og:locale" content="ja_JP" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="僕らのヴィンテージ - ヴィンテージアイテムの交換プラットフォーム"
    />
    <meta
      name="twitter:description"
      content="ヴィンテージアイテムを愛する人々が集まり、お気に入りのアイテムを交換できるプラットフォーム"
    />
    <meta
      name="twitter:image"
      content="https://bokurano-vintage.com/twitter-card.jpg"
    />

    <!-- その他のメタタグ -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://bokurano-vintage.com/" />
    <meta name="theme-color" content="#8B4513" />

    <!-- 構造化データ (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "僕らのヴィンテージ",
        "alternateName": "Bokurano Vintage",
        "url": "https://bokurano-vintage.com/",
        "description": "ヴィンテージアイテムの交換プラットフォーム",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://bokurano-vintage.com/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <title>僕らのヴィンテージ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
