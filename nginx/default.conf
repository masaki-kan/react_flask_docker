
# HTTPサーバー（証明書取得とHTTPSへのリダイレクト用）
server {
    listen 80;
    server_name bokurano-vintage.com www.bokurano-vintage.com;

    # Let's Encrypt証明書の検証用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # それ以外はHTTPSにリダイレクト
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPSサーバー
server {
    listen 443 ssl;
    # server_name 35.78.248.43;
    server_name bokurano-vintage.com www.bokurano-vintage.com;

    ssl_certificate /etc/nginx/ssl/localhost.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost-key.pem;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # index.html に対する rewrite loop を防ぐ
    location = /index.html {
        try_files $uri =404;
    }

    # React SPA のルーティング対応（全て index.html にフォールバック）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 画像ファイルの配信
    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Flask API へのリバースプロキシ設定
    location /api/ {
        proxy_pass http://flask_app:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Socket.IO 通信用
    location /socket.io/ {
        proxy_pass http://flask_app:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}